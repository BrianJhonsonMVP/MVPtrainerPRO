<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Plataforma premium para entrenadores personales con IA." />
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#050509" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>MVP-Trainer-Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        /* BRANDING: MVP VENTURES */
        --mvp-orange: #FF5B0B; /* Primary Brand Color */
        --mvp-gold: #FBBF24;   /* Secondary/Accent */
        --mvp-bg: #050509;     /* Deep Black Background */
        --mvp-card: #130816;   /* Deep Purple Card Background */
      }

      body {
        font-family: 'Manrope', sans-serif;
        background-color: var(--mvp-bg);
        color: #ffffff;
        overscroll-behavior-y: none;
      }
      /* Custom scrollbar for dark theme */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--mvp-bg); 
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--mvp-orange); 
      }
      
      /* Animaciones básicas */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.3s ease-out forwards;
      }
      .animate-slideUp {
        animation: slideUp 0.4s ease-out forwards;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              mvp: {
                black: '#050509',      /* Main Background */
                dark: '#130816',       /* Card Background */
                orange: 'var(--mvp-orange)', /* Dynamic Primary */
                gold: 'var(--mvp-gold)',     /* Dynamic Secondary */
              }
            },
            backgroundImage: {
              'mvp-gradient': 'linear-gradient(135deg, #130816 0%, #050509 100%)',
              'mvp-accent-gradient': 'linear-gradient(135deg, var(--mvp-orange) 0%, #ea580c 100%)',
            }
          }
        }
      }
    </script>
